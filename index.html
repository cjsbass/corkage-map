L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:20}).addTo(map);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host=u=>new URL(u).hostname.replace('www.','');
D.forEach((r,i)=>{r.i=i;r.m=L.circleMarker([r.lat,r.lng],{radius:9,color:'#0f1115',weight:2,fillColor:C[r.status],fillOpacity:.95});
const g='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.name+' '+r.address+(r.city=='Milan'?' Milano':' London'));
r.m.bindPopup(`<div class="pp"><h3>${esc(r.name)}</h3><div class="a">${esc(r.address)}</div><span class="fee ${r.status=='fee'?'fee-c':r.status}">${esc(r.fee)}</span><p>${esc(r.notes)}</p><div class="links">${r.sources.map(s=>`<a href="${s}" target="_blank" rel="noopener">↗ ${host(s)}</a>`).join('')}<a href="${g}" target="_blank" rel="noopener">📍 Google Maps</a></div></div>`,{maxWidth:290});
r.m.on('click',()=>hl(i))});
function hl(i){document.querySelectorAll('.item').forEach(e=>e.classList.toggle('act',+e.dataset.i===i));const e=document.querySelector(`.item[data-i="${i}"]`);e&&e.scrollIntoView({block:'nearest',behavior:'smooth'})}
function draw(){const L2=document.getElementById('list');L2.innerHTML='';const s=q.toLowerCase();
D.forEach(r=>{const show=r.city==city&&!off.has(r.status)&&(!s||(r.name+r.address+r.fee+r.notes).toLowerCase().includes(s));
if(show){r.m.addTo(map);const d=document.createElement('div');d.className='item';d.dataset.i=r.i;
d.innerHTML=`<b>${esc(r.name)}</b><div class="a">${esc(r.address)}</div><span class="fee ${r.status=='fee'?'fee-c':r.status}">${esc(r.fee)}</span>`;
d.onclick=()=>{map.flyTo([r.lat,r.lng],15,{duration:.6});setTimeout(()=>r.m.openPopup(),650);hl(r.i)};L2.appendChild(d)}else r.m.remove()});
if(!L2.children.length)L2.innerHTML='<div class="item a" style="color:#8b93a7">No matches.</div>'}
document.querySelectorAll('.tog button').forEach(b=>b.onclick=()=>{city=b.dataset.c;document.querySelectorAll('.tog button').forEach(x=>x.classList.toggle('on',x==b));map.flyTo(...V[city],{duration:.8});draw()});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const s=c.dataset.s;off.has(s)?off.delete(s):off.add(s);c.classList.toggle('off');draw()});
document.getElementById('q').oninput=e=>{q=e.target.value;draw()};draw();
</script></body></html>
